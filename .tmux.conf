# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'tmux-plugins/vim-tmux'
# if-shell "uname | grep  -q Darwin" "set -g @plugin 'tmux-plugins/tmux-open'"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

# Terminal coloring
set -g mouse on

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Enable catppuccin
run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run ~/.tmux/plugins/tmux-cpu/cpu.tmux
run ~/.tmux/plugins/tmux-battery/battery.tmux

# Ensure the window labels show the real window name, not the hostname
set -g @catppuccin_window_default_text "\ #W"
set -g @catppuccin_window_text "\ #W"
set -g @catppuccin_window_current_text "\ #W"

## CONTROLS
# Set Prefix to C-a (if mac [local]) or C-s (remote) 
if-shell "uname | grep -q  Darwin" "set-option -g prefix C-a" "set-option -g prefix C-s"
if-shell "uname | grep -q  Darwin" "bind-key a send-prefix" "bind-key s send-prefix" # send prefix to nested session
unbind-key C-b

# Vi copypaste mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

# Create a new window  or pane on the current directory
# Link: https://unix.stackexchange.com/a/12091/211544
bind-key c   new-window -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key %   split-window  -h -c '#{pane_current_path}'

# restoring vim session
# set -g @resurrect-strategy-vim 'session'

# Restoring pane contents
# set -g @resurrect-capture-pane-contents 'on'

# bash shell
set-option -g default-shell "/bin/zsh"

